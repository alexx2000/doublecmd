name: build-release

on:
  workflow_dispatch:
  release:
    types: [prereleased, released]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lin:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm64

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Install dependencies
      run: |
           sudo apt update
           sudo apt install fp-units-rtl fp-units-gtk2 fp-compiler fp-units-base fp-units-fcl \
                            fp-units-misc fp-units-net fp-utils patchelf libgtk-3-dev libdbus-1-dev zip

    - name: Get Lazarus source
      uses: actions/checkout@v7
      with:
            repository: 'fpc/Lazarus'
            ref: 'fixes_4'

    - name: Build and install Lazarus
      run: |
           make all
           sudo make install

    - name: Create Lazarus config
      run: |
           mkdir -p $HOME/.lazarus
           cp tools/install/linux/environmentoptions.xml $HOME/.lazarus/environmentoptions.xml
           sed -i -e "s|__LAZARUSDIR__|/usr/local/share/lazarus|g" $HOME/.lazarus/environmentoptions.xml

    - name: Checkout source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build packages
      run: ./.github/scripts/create_release.lnx

    - name: Share data between jobs
      uses: actions/upload-artifact@v7
      with:
        name: snapshot-lin-${{ matrix.arch }}
        retention-days: 1
        compression-level: 0
        path: doublecmd-release/doublecmd*.tar.xz
